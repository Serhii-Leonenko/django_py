{% extends "base.html" %}

{% block title %}Logged out | Messenger{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card text-center shadow-sm">
            <div class="card-body p-5">
                <h1 class="card-title h4 mb-2">You have been logged out</h1>
                <p class="text-body-secondary mb-4">Thanks for stopping by.</p>
                <a href="{% url 'registration:login' %}" class="btn btn-primary">Log in again</a>
                <a href="{% url 'messenger:home' %}" class="btn btn-outline-secondary">Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
